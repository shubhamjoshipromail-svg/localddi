[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localddi"
version = "0.1.1"
description = "Self-hosted drug-drug interaction API with endpoints compatible with the discontinued NLM RxNav Interaction API. Not for clinical use."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shubham Joshi" }]
keywords = ["drug-interactions", "rxnorm", "rxnav", "ddi", "self-hosted", "api", "health-it"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
localddi = "localddi.cli:main"

[project.urls]
Homepage = "https://github.com/shubhamjoshipromail-svg/localddi"
Issues = "https://github.com/shubhamjoshipromail-svg/localddi/issues"

[tool.setuptools.packages.find]
include = ["localddi*"]

[tool.setuptools.package-data]
localddi = ["data/*.csv", "fixtures/*.csv", "fixtures/rrf/*.RRF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
